spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:tamagotchi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

github:
  client-id: ${GITHUB_CLIENT_ID:}
  client-secret: ${GITHUB_CLIENT_SECRET:}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/oauth/github/callback}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:dev-webhook-secret}
    callback-url: ${GITHUB_WEBHOOK_CALLBACK_URL:http://localhost:8080/github/webhook}

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration-ms: 86400000

server:
  port: 8080
